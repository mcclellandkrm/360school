# Uploads the website to the Plesk server whenever main is pushed to GitHub.
#
# - Upload only: lftp mirror without --delete never removes anything on the
#   server, so tour folders (/LHS/, /SilverstreamPS/, /MalluskIPS/, /tours/ ...)
#   uploaded via FileZilla are never touched.
# - Uses lftp because Plesk's ProFTPD requires TLS session reuse on FTPS data
#   connections, which lftp (like FileZilla) supports.
# - FTP details live in GitHub: Settings > Secrets and variables > Actions
#     FTP_SERVER    194.164.92.145 (same host as FileZilla)
#     FTP_USERNAME
#     FTP_PASSWORD
# - Can also be run by hand: Actions tab > Deploy to 360school.co.uk > Run workflow

name: Deploy to 360school.co.uk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload site via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror --reverse --verbose --no-perms --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob .claude/ \
              --exclude-glob dist/ \
              --exclude-glob 'old files/' \
              --exclude-glob 'Graphics and Media/' \
              --exclude-glob includes/ \
              --exclude-glob development/ \
              --exclude-glob node_modules/ \
              --exclude-glob package.json \
              --exclude-glob package-lock.json \
              --exclude-glob netlify.toml \
              --exclude-glob _headers \
              --exclude-glob '*.md' \
              ./ httpdocs/
          "
